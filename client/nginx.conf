server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de banner Nginx en réponse
    server_tokens off;

    # Sécurité de base — headers HTTP recommandés
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header X-XSS-Protection          "1; mode=block"  always;

    # ── API : proxy vers le backend Node ─────────────────────────────────────
    # Le bundle est construit avec REACT_APP_API_URL=/api (cf. client/Dockerfile),
    # donc le navigateur appelle le MEME origine. Sans ce proxy, /api/* tombe
    # dans le fallback SPA et renvoie index.html au lieu du JSON.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies httpOnly d'auth (bb_access / bb_refresh) : rien a reecrire,
        # on est sur la meme origine.
        proxy_read_timeout 60s;
    }

    # ── Socket.IO : upgrade WebSocket vers le backend ────────────────────────
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Routing React SPA : toute URL inconnue renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de cache sur index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache long sur les assets statiques (CRA génère des noms hashés)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
